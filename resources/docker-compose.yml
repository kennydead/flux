name: agentfarm

services:
  dashboard-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: farm
      POSTGRES_DB: farm
    volumes:
      - dashboard-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dashboard-backend:
    image: ghcr.io/kennydead/claude-agent-farm/dashboard-backend:${FARM_CHANNEL:-latest}
    # Linux Docker Engine does not provide host.docker.internal (Docker Desktop does); the backend
    # reaches published preview ports through it (routers/specs.py _preview_answers). Harmless elsewhere.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # The API is only for this computer (Flux, the dashboard proxies it): never on the network.
      - "127.0.0.1:8090:8090"
    env_file:
      - path: .env
        required: false
    environment:
      DASHBOARD_DATABASE_URL: postgresql+asyncpg://farm:farm@dashboard-db:5432/farm
      DASHBOARD_SECRET_KEY: ${DASHBOARD_SECRET_KEY:-change-this-before-use}
      DASHBOARD_CORS_ORIGINS: http://localhost:5174
      COMPOSE_PROJECT_DIR: ${COMPOSE_PROJECT_DIR:-${PWD:-}}
      LICENSE_SERVER_URL: https://oywppqdqfcypawrthfox.supabase.co/functions/v1/validate-license
      DIAGNOSTICS_SERVER_URL: https://oywppqdqfcypawrthfox.supabase.co/functions/v1/receive-diagnostic
      # Master switch for the LiteLLM gateway. Default OFF for now — the farm hard-locks to the
      # user's own Claude subscription (connect it in Settings) and can't bill our gateway, with
      # no .env setup needed. Set FARM_GATEWAY_ENABLED=true only once the gateway product is live.
      FARM_GATEWAY_ENABLED: ${FARM_GATEWAY_ENABLED:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config.yml:/farm/config.yml:ro
      - ./.env:/farm/.env
      - ./logs:/farm/logs
      - ./live:/farm/live
      - claude-home:/home/agent:ro
      - demo-repos:/demo-repos
    depends_on:
      dashboard-db:
        condition: service_healthy
    restart: unless-stopped

  dashboard-frontend:
    image: ghcr.io/kennydead/claude-agent-farm/dashboard-frontend:${FARM_CHANNEL:-latest}
    ports:
      # This computer only, unless Settings → "Access from other devices" sets FARM_LISTEN_ADDRESS
      # (in .env) to 0.0.0.0 — which also requires the dashboard login.
      - "${FARM_LISTEN_ADDRESS:-127.0.0.1}:5174:5174"
    depends_on:
      - dashboard-backend
    restart: unless-stopped

  coder:
    image: ghcr.io/kennydead/claude-agent-farm/agent:${FARM_CHANNEL:-latest}
    env_file: .env
    environment:
      AGENT_MODE: coder
    volumes:
      - ./config.yml:/app/config.yml:ro
      - claude-home:/home/agent
      - coder-workspace:/workspace/coder
      - ./logs:/app/logs
      - demo-repos:/demo-repos
    profiles:
      - agents
    restart: unless-stopped

  reviewer:
    image: ghcr.io/kennydead/claude-agent-farm/agent:${FARM_CHANNEL:-latest}
    env_file: .env
    environment:
      AGENT_MODE: reviewer
      WORKSPACE_DIR: /workspace/reviewer
    volumes:
      - ./config.yml:/app/config.yml:ro
      - claude-home:/home/agent
      - reviewer-workspace:/workspace/reviewer
      - ./logs:/app/logs
      - demo-repos:/demo-repos
    profiles:
      - agents
    restart: unless-stopped

  planner:
    image: ghcr.io/kennydead/claude-agent-farm/agent:${FARM_CHANNEL:-latest}
    env_file: .env
    environment:
      AGENT_MODE: planner
    volumes:
      - ./config.yml:/app/config.yml:ro
      - claude-home:/home/agent
      - ./logs:/app/logs
      - demo-repos:/demo-repos
    profiles:
      - agents
    restart: unless-stopped

  auditor:
    image: ghcr.io/kennydead/claude-agent-farm/agent:${FARM_CHANNEL:-latest}
    env_file: .env
    environment:
      AGENT_MODE: auditor
      WORKSPACE_DIR: /workspace/auditor
      AUDIT_WORKSPACE: /workspace/auditor
    volumes:
      - ./config.yml:/app/config.yml:ro
      - claude-home:/home/agent
      - auditor-workspace:/workspace/auditor
      - ./logs:/app/logs
      - demo-repos:/demo-repos
    profiles:
      - agents
      - scheduled-audit
    restart: unless-stopped

volumes:
  dashboard-db-data:
  claude-home:
  coder-workspace:
  reviewer-workspace:
  auditor-workspace:
  demo-repos:
