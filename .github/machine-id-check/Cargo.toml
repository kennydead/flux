# Compiles src-tauri/src/machine_id.rs on its own (no Tauri), so its tests can run on Windows CI:
# a test binary that links Tauri can't start there without an app manifest (STATUS_ENTRYPOINT_NOT_FOUND).
[package]
name = "machine-id-check"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
sha2 = "0.10"
serde_json = "1"

[workspace]
